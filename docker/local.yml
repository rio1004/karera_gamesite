name: aggregator
services:
  game_site:
    build:
      context: ../
      dockerfile: docker/LocalDockerfile
      args:
        - CACHE_BUST=1
    depends_on:
      aggregator_backend:
        condition: service_healthy
    ports:
      - 3001:3000
    networks:
      - aggregator_network
    volumes:
      - ../:/app
      - /app/node_modules
